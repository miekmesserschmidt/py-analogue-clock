[project]
name = "py-analogue-clock"
version = "0.2.0"
description = "Generate SVG analogue clock faces displaying specified times"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "svgwrite>=1.4.3",
    "typer>=0.20.0",
]
authors = [
    { name = "Miek Messerschmidt", email = "mmesserschmidt@gmail.com" }
]
keywords = ["svg", "clock", "analogue", "time", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
analogueclock = "analogue_clock.main:app"
